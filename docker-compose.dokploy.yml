    - -template
    - /t/vanilla/media/play/web_service/environment_data.xml.template:/usr/share/nginx/vanilla/media/play/web_service/environment_data.xml
    - nginx
    - -g
    - daemon off;
    labels:
      net.unraid.docker.webui: http://[IP]:[PORT:${WEB_PORT}]
      net.unraid.docker.icon: https://raw.githubusercontent.com/solero/wand/refs/heads/master/icons/houdini.png
  websocket:
    build: ./websocket
    restart: always
    environment:
      WEB_LEGACY_PLAY: ${WEB_LEGACY_PLAY}
      WEB_VANILLA_PLAY: ${WEB_VANILLA_PLAY}
      GAME_LOGIN_PORT: ${GAME_LOGIN_PORT}
      SNOWFLAKE_PORT: ${SNOWFLAKE_PORT}
    networks:
      wand:
        aliases:
        - websocket
    read_only: true
    tmpfs:
    - /tmp:size=1m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  houdini_login:
    build: ./houdini
    restart: always
    env_file:
