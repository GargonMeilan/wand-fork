# Generated by scripts/generate-dokploy-compose.py; edit docker-compose.yml instead.
# Dokploy: enable Git submodules, retain the project name/data volumes, route domains to web:80.
services:
  db:
    image: postgres:12.22-alpine
    restart: always
    env_file:
    - .env
    networks:
      wand:
        aliases:
        - db
    volumes:
    - type: bind
      source: ./houdini/houdini.sql
      target: /docker-entrypoint-initdb.d/houdini.sql
      read_only: true
      bind:
        create_host_path: false
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_USER"
      interval: 8s
      timeout: 5s
      retries: 15
      start_period: 30s
      start_interval: 5s
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/solero/wand/refs/heads/master/icons/db.png
  redis:
    image: redis:8.10.3-alpine
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    volumes:
    - redis_data:/data
    networks:
      wand:
        aliases:
        - redis
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/solero/wand/refs/heads/master/icons/redis.png
  web:
    build: ./web
    restart: always
    env_file:
    - .env
    networks:
      wand:
        aliases:
        - web
    depends_on:
      websocket:
        condition: service_started
        restart: true
      dash:
        condition: service_healthy
        restart: true
    volumes:
    - type: bind
      source: ./www
      target: /usr/share/nginx/html
      bind:
        create_host_path: false
    - type: bind
      source: ./legacy-media
      target: /usr/share/nginx/legacy
      bind:
        create_host_path: false
    - type: bind
      source: ./vanilla-media
      target: /usr/share/nginx/vanilla
      bind:
        create_host_path: false
    - type: bind
      source: ./servers.xml
      target: /t/servers.xml
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./templates/sites/legacy.conf.template
      target: /etc/nginx/conf.d/legacy.conf.template
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./templates/sites/vanilla.conf.template
      target: /etc/nginx/conf.d/vanilla.conf.template
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./templates/legacy-media/play/index.html.template
      target: /t/legacy/play/index.html.template
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./templates/legacy-media/play/es/index.html.template
      target: /t/legacy/play/es/index.html.template
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./templates/legacy-media/play/fr/index.html.template
      target: /t/legacy/play/fr/index.html.template
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./templates/legacy-media/play/pt/index.html.template
      target: /t/legacy/play/pt/index.html.template
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./templates/vanilla-media/play/index.html.template
      target: /t/vanilla/play/index.html.template
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./templates/vanilla-media/play/es/index.html.template
      target: /t/vanilla/play/es/index.html.template
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./templates/vanilla-media/play/fr/index.html.template
      target: /t/vanilla/play/fr/index.html.template
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./templates/vanilla-media/play/pt/index.html.template
      target: /t/vanilla/play/pt/index.html.template
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./templates/vanilla-media/media/play/web_service/environment_data.xml.template
      target: /t/vanilla/media/play/web_service/environment_data.xml.template
      read_only: true
      bind:
        create_host_path: false
    command:
    - dockerize
    - -template
    - /etc/nginx/conf.d/legacy.conf.template:/etc/nginx/conf.d/legacy.conf
    - -template
    - /etc/nginx/conf.d/vanilla.conf.template:/etc/nginx/conf.d/vanilla.conf
    - -template
    - /t/servers.xml:/usr/share/nginx/legacy/media/servers.xml
    - -template
    - /t/servers.xml:/usr/share/nginx/vanilla/play/servers.xml
    - -template
    - /t/legacy/play/index.html.template:/usr/share/nginx/legacy/play/index.html
    - -template
    - /t/legacy/play/index.html.template:/usr/share/nginx/legacy/play/en/index.html
    - -template
    - /t/legacy/play/es/index.html.template:/usr/share/nginx/legacy/play/es/index.html
    - -template
    - /t/legacy/play/fr/index.html.template:/usr/share/nginx/legacy/play/fr/index.html
    - -template
    - /t/legacy/play/pt/index.html.template:/usr/share/nginx/legacy/play/pt/index.html
    - -template
    - /t/vanilla/play/index.html.template:/usr/share/nginx/vanilla/play/index.html
    - -template
    - /t/vanilla/play/index.html.template:/usr/share/nginx/vanilla/play/en/index.html
    - -template
    - /t/vanilla/play/es/index.html.template:/usr/share/nginx/vanilla/play/es/index.html
    - -template
