      source: ./houdini
      target: /usr/src/houdini
      bind:
        create_host_path: false
    - type: bind
      source: ./web/check_houdini.py
      target: /opt/wand/check_houdini.py
      read_only: true
      bind:
        create_host_path: false
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    entrypoint:
    - python
    - bootstrap.py
    - login
    healthcheck:
      test:
      - CMD
      - python
      - /opt/wand/check_houdini.py
      - ${GAME_LOGIN_PORT}
      interval: 60s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 5s
    command:
    - --port
    - ${GAME_LOGIN_PORT}
    - --redis-address
    - redis
    - --database-address
    - db
    - --database-user
    - ${POSTGRES_USER}
    - --database-name
    - ${POSTGRES_USER}
    - --database-password
    - ${POSTGRES_PASSWORD}
    labels:
      net.unraid.docker.icon: https://raw.githubusercontent.com/solero/wand/refs/heads/master/icons/houdini.png
